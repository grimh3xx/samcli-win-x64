name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - run: copy build\Release\samcli.exe samcli-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: samcli-windows-x64
          path: samcli-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: cp build/samcli samcli-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: samcli-linux-x64
          path: samcli-linux-x64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            samcli-windows-x64.exe
            samcli-linux-x64
          generate_release_notes: true
